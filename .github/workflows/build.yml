name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Flet
        run: pip install flet

      - name: Build Android APK
        run: flet package android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bp-calendar-apk
          path: output/
          retention-days: 7
